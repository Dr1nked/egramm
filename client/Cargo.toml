[package]
name = "egramm-client"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
base64 = "0.22"
rand = "0.8"
chrono = "0.4"
rfd = "0.15"
open = "5"
image = "0.25"
cpal = "0.15"
rodio = { version = "0.19", features = ["mp3"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"

[build-dependencies]
winres = "0.1"